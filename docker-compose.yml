services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kevops-mcp
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-80}:${PORT:-8080}"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kevops-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    restart: unless-stopped
